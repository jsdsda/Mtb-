<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTB Wochen-Umfrage & Media Hub 🚵‍♂️</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col items-center py-10 px-4">

    <div class="max-w-md w-full bg-gray-800 rounded-2xl shadow-xl p-6 border border-gray-700">
        
        <!-- Login Ansicht -->
        <div id="loginSection" class="space-y-4">
            <header class="text-center mb-6">
                <h1 class="text-2xl font-bold text-green-400">MTB Ride Planner 🌲</h1>
                <p class="text-sm text-gray-400 mt-1">Bitte gib deinen Namen ein, um fortzufahren:</p>
            </header>
            <form id="loginForm" class="space-y-4">
                <input type="text" id="loginName" required placeholder="Dein Name (z.B. Tim)" 
                    class="w-full px-4 py-2 bg-gray-900 border border-gray-700 rounded-lg focus:outline-none focus:border-green-500 text-white">
                <button type="submit" class="w-full bg-green-600 hover:bg-green-500 text-white font-semibold py-2.5 rounded-lg transition shadow-lg">
                    Einloggen & Mitfahren 🚀
                </button>
            </form>
        </div>

        <!-- Haupt-App -->
        <div id="appSection" class="hidden space-y-6">
            <header class="text-center">
                <h1 class="text-2xl font-bold text-green-400">MTB Ride Planner 🌲</h1>
                <p id="weekDisplay" class="text-xs text-green-300 font-semibold mt-1 bg-green-900/40 py-1 px-2 rounded border border-green-700/50 inline-block"></p>
                <p class="text-sm text-gray-400 mt-2">Eingeloggt als: <span id="currentUserDisplay" class="text-white font-semibold"></span> 
                    <button id="logoutBtn" class="text-xs text-red-400 hover:underline ml-2">(Wechseln)</button>
                </p>
            </header>

            <!-- Abstimm-Formular -->
            <form id="pollForm" class="space-y-4 bg-gray-900/50 p-4 rounded-xl border border-gray-700">
                <label class="block text-sm font-medium text-gray-300 mb-2">An welchen Tagen hast du diese Woche Zeit?</label>
                <div class="grid grid-cols-1 gap-2" id="daysContainer"></div>
                
                <div class="space-y-2 pt-2">
                    <button type="submit" class="w-full bg-green-600 hover:bg-green-500 text-white font-semibold py-2 rounded-lg transition shadow-lg">
                        Auswahl speichern ✅
                    </button>
                    <button type="button" id="whatsappShareBtn" class="w-full bg-emerald-700 hover:bg-emerald-600 text-white font-semibold py-2 rounded-lg transition shadow-lg flex items-center justify-center space-x-2">
                        <span>Per WhatsApp teilen 📱</span>
                    </button>
                </div>
            </form>

            <!-- Übersicht & Video-Hub -->
            <div>
                <h2 class="text-lg font-semibold text-gray-200 mb-3 border-b border-gray-700 pb-2">Wer kann wann & Videos 🎥</h2>
                <div id="resultsList" class="space-y-4"></div>
            </div>
        </div>
        
    </div>

    <!-- JavaScript Logik -->
    <script>
        const loginSection = document.getElementById("loginSection");
        const appSection = document.getElementById("appSection");
        const loginForm = document.getElementById("loginForm");
        const loginNameInput = document.getElementById("loginName");
        const currentUserDisplay = document.getElementById("currentUserDisplay");
        const logoutBtn = document.getElementById("logoutBtn");
        const weekDisplay = document.getElementById("weekDisplay");
        const daysContainer = document.getElementById("daysContainer");
        const pollForm = document.getElementById("pollForm");
        const resultsList = document.getElementById("resultsList");
        const whatsappShareBtn = document.getElementById("whatsappShareBtn");

        let currentUser = localStorage.getItem("mtb_current_user") || "";

        function getCurrentWeekDays() {
            const now = new Date();
            const currentDayOfWeek = now.getDay();
            const distanceToMonday = currentDayOfWeek === 0 ? -6 : 1 - currentDayOfWeek;
            
            const monday = new Date(now);
            monday.setDate(now.getDate() + distanceToMonday);

            const days = ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag", "Sonntag"];
            
            return days.map((dayName, index) => {
                const d = new Date(monday);
                d.setDate(monday.getDate() + index);
                const formattedDate = d.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" });
                return { name: dayName, date: formattedDate, key: `${dayName} (${formattedDate})` };
            });
        }

        const weekDays = getCurrentWeekDays();

        function getWeekIdentifier() {
            const d = new Date();
            d.setHours(0, 0, 0, 0);
            d.setDate(d.getDate() + 4 - (d.getDay() || 7));
            const yearStart = new Date(d.getFullYear(), 0, 1);
            const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
            return `${d.getFullYear()}-W${weekNo}`;
        }

        const currentWeekKey = "mtb_votes_" + getWeekIdentifier();
        const mediaWeekKey = "mtb_media_" + getWeekIdentifier();

        // Automatisches Aufräumen: Alte Daten/Videos nach Ablauf löschen (alles was nicht aktuelle Woche ist)
        function cleanOldData() {
            Object.keys(localStorage).forEach(key => {
                if ((key.startsWith("mtb_votes_") || key.startsWith("mtb_media_")) && key !== currentWeekKey && key !== mediaWeekKey) {
                    localStorage.removeItem(key);
                }
            });
        }
        cleanOldData();

        if (currentUser) {
            showApp();
        }

        loginForm.addEventListener("submit", (e) => {
            e.preventDefault();
            const name = loginNameInput.value.trim();
            if (name) {
                currentUser = name;
                localStorage.setItem("mtb_current_user", currentUser);
                showApp();
            }
        });

        logoutBtn.addEventListener("click", () => {
            localStorage.removeItem("mtb_current_user");
            currentUser = "";
            loginSection.classList.remove("hidden");
            appSection.classList.add("hidden");
            loginNameInput.value = "";
        });

        function showApp() {
            loginSection.classList.add("hidden");
            appSection.classList.remove("hidden");
            currentUserDisplay.textContent = currentUser;
            weekDisplay.textContent = `Woche: ${weekDays[0].date} – ${weekDays[6].date}`;
            renderDaysCheckboxes();
            renderResults();
        }

        function renderDaysCheckboxes() {
            daysContainer.innerHTML = "";
            let votes = JSON.parse(localStorage.getItem(currentWeekKey)) || [];
            let userVote = votes.find(v => v.name.toLowerCase() === currentUser.toLowerCase());
            let userSelectedDays = userVote ? userVote.days : [];

            weekDays.forEach(day => {
                const isChecked = userSelectedDays.includes(day.key);
                const label = document.createElement("label");
                label.className = "flex items-center justify-between bg-gray-900 p-2.5 rounded-lg border border-gray-700 cursor-pointer hover:border-green-500 transition";
                
                label.innerHTML = `
                    <div class="flex items-center space-x-2">
                        <input type="checkbox" name="day" value="${day.key}" ${isChecked ? 'checked' : ''} class="accent-green-500 w-4 h-4">
                        <span class="text-sm font-medium">${day.name}</span>
                    </div>
                    <span class="text-xs text-gray-400">${day.date}</span>
                `;
                daysContainer.appendChild(label);
            });
        }

        pollForm.addEventListener("submit", (e) => {
            e.preventDefault();
            saveCurrentVote();
            alert("Deine Auswahl wurde gespeichert!");
        });

        function saveCurrentVote() {
            const selectedDays = Array.from(document.querySelectorAll('input[name="day"]:checked'))
                                      .map(cb => cb.value);

            let votes = JSON.parse(localStorage.getItem(currentWeekKey)) || [];
            const existingIndex = votes.findIndex(v => v.name.toLowerCase() === currentUser.toLowerCase());
            
            const voteData = { name: currentUser, days: selectedDays };

            if (existingIndex > -1) {
                votes[existingIndex] = voteData;
            } else {
                votes.push(voteData);
            }

            localStorage.setItem(currentWeekKey, JSON.stringify(votes));
            renderResults();
        }

        whatsappShareBtn.addEventListener("click", () => {
            saveCurrentVote();
            const selectedDays = Array.from(document.querySelectorAll('input[name="day"]:checked'))
                                      .map(cb => cb.value);

            let text = `🚵‍♂️ *MTB Ride Planner* (${weekDays[0].date} – ${weekDays[6].date})\n\n`;
            text += `Ich (${currentUser}) kann diese Woche an folgenden Tagen biken:\n`;
            
            if (selectedDays.length === 0) {
                text += `*(Bisher noch keine Tage ausgewählt)*\n`;
            } else {
                selectedDays.forEach(d => { text += `• ${d}\n`; });
            }
            text += `\nTrag dich auch hier ein & lad Videos hoch: ${window.location.href}`;

            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
        });

        // Video Handling
        function handleVideoUpload(dayKey, file) {
            if (file.size > 50 * 1024 * 1024) { // 50MB Limit wegen Browser-Speicher
                alert("Die Datei ist zu groß (max. 50MB empfohlen).");
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Data = e.target.result;
                let mediaData = JSON.parse(localStorage.getItem(mediaWeekKey)) || {};
                
                if (!mediaData[dayKey]) {
                    mediaData[dayKey] = [];
                }

                mediaData[dayKey].push({
                    uploader: currentUser,
                    name: file.name,
                    data: base64Data
                });

                localStorage.setItem(mediaWeekKey, JSON.stringify(mediaData));
                renderResults();
                alert("Video erfolgreich hochgeladen! 🎬");
            };
            reader.readAsDataURL(file);
        }

        window.deleteVideo = function(dayKey, index) {
            let mediaData = JSON.parse(localStorage.getItem(mediaWeekKey)) || {};
            if (mediaData[dayKey]) {
                mediaData[dayKey].splice(index, 1);
                localStorage.setItem(mediaWeekKey, JSON.stringify(mediaData));
                renderResults();
            }
        };

        function renderResults() {
            resultsList.innerHTML = "";
            let votes = JSON.parse(localStorage.getItem(currentWeekKey)) || [];
            let mediaData = JSON.parse(localStorage.getItem(mediaWeekKey)) || {};

            weekDays.forEach(day => {
                const availableUsers = votes.filter(v => v.days.includes(day.key)).map(v => v.name);
                const isUserPresent = availableUsers.includes(currentUser);
                const dayVideos = mediaData[day.key] || [];

                const card = document.createElement("div");
                card.className = "bg-gray-900 p-3 rounded-lg border border-gray-700 flex flex-col space-y-2";
                
                const dayHeader = document.createElement("div");
                dayHeader.className = "flex justify-between items-center text-sm font-semibold text-green-400";
                dayHeader.innerHTML = `<span>${day.name}</span> <span class="text-xs text-gray-400">${day.date}</span>`;

                // Wer ist dabei
                const usersContainer = document.createElement("div");
                usersContainer.className = "flex flex-wrap gap-1";

                if (availableUsers.length === 0) {
                    const noBody = document.createElement("span");
                    noBody.className = "text-xs text-gray-500 italic";
                    noBody.textContent = "Bisher keine Zusagen";
                    usersContainer.appendChild(noBody);
                } else {
                    availableUsers.forEach(userName => {
                        const badge = document.createElement("span");
                        badge.className = "bg-green-900/60 text-green-200 text-xs px-2 py-0.5 rounded border border-green-700";
                        badge.textContent = userName;
                        usersContainer.appendChild(badge);
                    });
                }

                card.appendChild(dayHeader);
                card.appendChild(usersContainer);

                // Video Sektion (nur sichtbar/nutzbar, wenn man für den Tag eingetragen ist)
                const videoSection = document.createElement("div");
                videoSection.className = "mt-2 pt-2 border-t border-gray-800 space-y-2";

                if (dayVideos.length > 0) {
                    const videoListHeader = document.createElement("div");
                    videoListHeader.className = "text-xs font-semibold text-gray-300";
                    videoListHeader.textContent = `Videos (${dayVideos.length}):`;
                    videoSection.appendChild(videoListHeader);

                    dayVideos.forEach((vid, vIndex) => {
                        const vidBox = document.createElement("div");
                        vidBox.className = "bg-gray-800 p-2 rounded border border-gray-700 flex flex-col space-y-1";
                        
                        vidBox.innerHTML = `
                            <div class="flex justify-between items-center text-xs text-gray-400">
                                <span>Von <b>${vid.uploader}</b></span>
                                ${vid.uploader.toLowerCase() === currentUser.toLowerCase() ? `<button onclick="deleteVideo('${day.key}',${vIndex})" class="text-red-400 hover:underline">Löschen</button>` : ''}
                            </div>
                            <video controls class="w-full rounded max-h-48 bg-black">
                                <source src="${vid.data}" type="video/mp4">
                                Dein Browser unterstützt keine Videos.
                            </video>
                            <a href="${vid.data}" download="${vid.name}" class="text-center bg-gray-700 hover:bg-gray-600 text-green-300 text-xs py-1 rounded transition block">
                                📥 In voller Qualität herunterladen
                            </a>
                        `;
                        videoSection.appendChild(vidBox);
                    });
                }

                if (isUserPresent) {
                    const uploadBox = document.createElement("div");
                    uploadBox.className = "flex items-center space-x-2 pt-1";
                    uploadBox.innerHTML = `
                        <input type="file" accept="video/*" id="file_${day.key}" class="hidden">
                        <label for="file_${day.key}" class="cursor-pointer w-full bg-gray-800 hover:bg-gray-700 border border-gray-700 text-center text-xs text-gray-300 py-1.5 rounded transition">
                            🎬 Video für diesen Tag hochladen
                        </label>
                    `;
                    videoSection.appendChild(uploadBox);

                    setTimeout(() => {
                        const fileInput = document.getElementById(`file_${day.key}`);
                        if (fileInput) {
                            fileInput.addEventListener("change", (e) => {
                                if (e.target.files.length > 0) {
                                    handleVideoUpload(day.key, e.target.files[0]);
                                }
                            });
                        }
                    }, 0);
                } else {
                    const hint = document.createElement("div");
                    hint.className = "text-xs text-gray-500 italic text-center";
                    hint.textContent = "Trag dich für diesen Tag ein, um Videos hochzuladen.";
                    videoSection.appendChild(hint);
                }

                card.appendChild(videoSection);
                resultsList.appendChild(card);
            });
        }
    </script>
</body>
</html>
